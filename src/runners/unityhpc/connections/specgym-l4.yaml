controller_url: http://127.0.0.1:8301
runtime_root: /work/<pi_group>/<user>/agentic-sfv-runtime
gpu_type: l4
constraint: l4
gpu_request_by_constraint: true
partitions:
- gpu
cpu_partitions:
- cpu
max_concurrent: 1
timeout_seconds: 30
max_attempts: 2
allocation_limits:
  gpu_hours: null
  cpu_hours: null
download_limit_gib: null
model_cache: /scratch3/workspace/<user>-verus-specgym-reproduce/models
workspace_lease:
  name: verus-specgym-reproduce
  ssh_host: unity
  identity_file: ~/.ssh/<unity_key>
  duration_days: 30
qos: normal
