hardware:
  id: unity-a100-80g-v1
  gpu_count: 1
  gpu_name: NVIDIA A100-SXM4-80GB
  gpu_memory_mb: 81920
  allocated_cpus: 8
  allocated_memory_mb: 131072
walltime_seconds: 9000
model_server:
  local_model_metadata: true
  # Sequential shard reads avoid NFS mmap/prefetch stalls during startup.
  extra_args: [--safetensors-load-strategy, eager]
  port: 8000
  context_length: 131072
  command: env VLLM_USE_FLASHINFER_SAMPLER=0 vllm serve {model} --revision c202236235762e1c871ad0ccb60c8ee5ba337b9a
    --served-model-name Qwen3.5-9B --port {port} --tensor-parallel-size 1 --max-model-len
    {context_length} --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser
    qwen3_coder --language-model-only
smoke_walltime_seconds: 7200
evaluation:
  context_length: 131072
  max_input_tokens: 98304
  max_output_tokens: 32768
  concurrent_trials: 2
  tasks_per_shard: 2
  temperature: 0.6
  top_p: 0.95
  completion_kwargs:
    extra_body:
      top_k: 20
      min_p: 0.0
  smoke_base_timeout_seconds: 1200
configuration_label: Qwen local baseline; 128K context, 32K output; completed-task
  checkpoints
