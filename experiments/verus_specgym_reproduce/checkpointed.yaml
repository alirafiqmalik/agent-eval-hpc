naming:
  vst: pinned 9B weights on VAST work storage after scratch3 loading stalls
  md: node-local model metadata; original weights remain on shared storage
  eg: eager safetensors loading from network storage; unchanged model weights and budgets
  k: maximum tasks per allocation/checkpoint batch
  p: concurrent agent trials
  w: maximum parallel allocation chains
  c: context token limit
  o: output token limit
  t06-p95: temperature 0.6, top_p 0.95
