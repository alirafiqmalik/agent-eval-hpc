hardware_selection:
  observed_at: '2026-10-13T07:45:00Z'
  source: Unity controller catalog/telemetry plus live Slurm node, queue, and reservation
    queries
  selected: 8 x H200 NVL on gpu-preempt; only discovered single-node placement with
    enough native GPU memory for all three checkpoints
  alternatives:
    A100_80GB_8: '640 GB aggregate: insufficient for GLM FP8 and DeepSeek; Kimi leaves
      limited context headroom. CPU offload would add unmeasured latency to time-limited
      agent trials.'
    H100_80GB_4: '320 GB aggregate: insufficient for these checkpoints'
    L40S_48GB_4: '192 GB aggregate: insufficient for these checkpoints'
  historical_h200_preempt_wait_p50_seconds: 2843
  historical_sample_count: 266
  live_queue_caveat: gpu057 has private allocations with up to 11 days 15 hours remaining;
    historical averages do not predict this 8-GPU request. No near-term start is guaranteed.
  hardware_verified_by: controller allocation receipt; model memory and kernel compatibility
    remain subject to GPU smoke tests
  slurm_estimated_start: '2026-10-25T01:56:39'
  controller_requirement: Unity HPC controller 0.16.2 or later, supporting gpu_request_by_constraint
  other_usable_gpus:
    a100_80gb: 8-GPU nodes (including gpu022-024) and 4-GPU nodes; select one card
      on short QoS for Qwen3.5-9B. 2026-10-13 09:01 UTC test-only estimated 10:48
      UTC start.
    h100_80gb: uri-gpu009/012, four GPUs each, InfiniBand. Select one card on normal
      QoS for Qwen3.5-27B; estimate October 14.
    l40s_48gb: Fits native 9B weights; October 25/27 estimates lose to A100/H100 in
      this snapshot.
    a100_16_multinode: Two 8-GPU A100 80GB nodes provide 1280 GiB aggregate and InfiniBand;
      test-only estimate October 19. This is a capacity candidate, not a verified
      serving placement. Current controller supports one-node jobs; pipeline/Ray launch
      and checkpoint-specific Ampere quantization kernels require separate validation.
    blackwell_mig_48gb: gpu058 exposes eight 48GB MIG slices of RTX PRO 6000 Blackwell
      Server Edition. A single slice has capacity for Qwen3.5-9B, but MIG-specific
      device attestation and kernels are unvalidated; aggregate 384GB cannot host
      the native paper checkpoints.
