deviations:
- Checkpointed cohorts preinstall the pinned SWE-agent revision and hash-locked client
  dependencies. Completed Harbor trials are retained across allocations; no within-task
  conversation or filesystem resume is claimed.
- The public checker chooses unused run IDs across both detailed and compressed logs,
  allowing retry after an agent deletes its detailed attempt logs. The pinned evaluator
  and hidden-test grading remain unchanged.
- Local inference only; closed models and GPT-specific repeat/codegen/judge experiments
  excluded by user request.
- Upstream sample script timeout_multiplier=2 (60 min agent) takes precedence over
  paper 75 min.
- Local inference has no API dollar cost; retain call and time limits instead of the
  paper $2.50 API cap.
- GLM uses the official FP8 release to fit one eight-H200 node.
- No plotting/auxiliary analysis source is published in the referenced repositories;
  empirical plots are reimplemented from documented formulas.
- Local context is capped at 131072 tokens, with 114688 input and 16384 output tokens;
  sampling retains SWE-agent defaults (temperature 0, top_p 1).
- Singularity limits aggregate resources at the Slurm allocation; the verifier uses
  its native SPECGEN_EVAL_MAX_WORKERS=4 setting per task.
- The task workspace uses Harbor's preexisting /testbed repository adapter, linked
  to /home/dev, with an empty Git baseline and the public template staged. This avoids
  Harbor 0.24's literal local-repository path and preserves native SWE-agent submit.
