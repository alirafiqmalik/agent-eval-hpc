# Modal provisions this hardware on demand. On 2026-11-26, explicit L4 sandbox
# requests in this workspace stayed pending while A10G sandboxes started at once,
# so the model server and the GPU probe use A10G. Modal places A10G requests on
# NVIDIA A10G or NVIDIA A10 cards, both 23028 MiB in nvidia-smi.
hardware:
  id: modal-a10g-v1
  # The orchestrator Function that runs Harbor. Trial sandboxes use task.toml.
  allocated_cpus: 2
  allocated_memory_mb: 4096
walltime_seconds: 3600
model_server:
  mode: modal
  image: vllm/vllm-openai:v0.33.0
  gpu: A10G
  gpu_count: 1
  gpu_names: [NVIDIA A10G, NVIDIA A10]
  gpu_memory_mb: 23028
  gpu_memory_tolerance_mb: 512
  cpus: 4
  memory_mb: 16384
  port: 8000
  context_length: 32768
  startup_timeout_seconds: 1200
  # Thinking is off to keep each agent turn short.
  command: >-
    vllm serve {model}
    --revision c1899de289a04d12100db370d81485cdf75e47ca
    --served-model-name Qwen3-0.6B
    --host 0.0.0.0 --port {port}
    --max-model-len {context_length}
    --gpu-memory-utilization 0.85
    --enable-auto-tool-choice --tool-call-parser hermes
    --reasoning-parser qwen3
    --default-chat-template-kwargs '{"enable_thinking": false}'
